# 单一组件晋级 —— 触发器（由 template-sync 分发到各组件 repo）
#
# 仅解析输入参数并调用组织级可复用工作流：
#   ff-eai/.github/.github/workflows/single-component-promote-release.yml
#
# 用法：手动触发，输入已发布版本的 code tag（如 v1.0.333），
# 将该版本的 deb 包从研发 Nexus（ff-eai-dev）晋级到商用 Nexus（ff-eai-release）。

name: "Call Single Component Promote"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Code tag to promote (format: v<MAJOR>.<MINOR>.<PATCH>, e.g. v1.0.333)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-promote:
    uses: ff-eai/.github/.github/workflows/single-component-promote-release.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      NEXUS_PUB_USER: ${{ secrets.NEXUS_PUB_USER }}
      NEXUS_PUB_PASS: ${{ secrets.NEXUS_PUB_PASS }}
